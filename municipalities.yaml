# One entry per municipality. Adding one is a five-line change.
# youtube: the channel's /videos URL. title_regex: a council session title (case-insensitive).
# lblod_harvester: 0..3 or null when the municipality is not in any Lokaal Beslist harvester.
# exclude: video id -> reason, for uploads that must not become a session (duplicates, wrong titles).
# lblod_label: the skos:prefLabel of the besluit:Bestuurseenheid; lblod_org: label of the Gemeenteraad organ.
# redact: regex -> replacement, applied after spelling to titles, summaries and transcript: names of people who are not
#   on the council and private details said in the room (on request or found in review).
- slug: haacht
  name: Haacht
  province: Vlaams-Brabant
  enabled: true
  youtube: https://www.youtube.com/channel/UCmmFija7h5J747aoCunqcKA
  title_regex: "gemeenteraad"
  lblod_harvester: null
  lblod_label: Haacht
  lblod_org: Gemeenteraad Haacht
  note: Green Valley portal, not harvested by Lokaal Beslist (checked 24 Sep 2026)
  spelling:  # recurring speech-recognition errors on the town's own names, fixed in titles, summaries and transcript
    Haagd: Haacht
    haagd: haacht
    Haagse Honderclub: Haachtse Hondenclub
    Haagse honderclub: Haachtse Hondenclub
    opverleningszone Oost-Vlaams-Baarwijk: hulpverleningszone Oost Vlaams-Brabant
    Oost-Vlaams-Baarwijk: Oost Vlaams-Brabant
  redact:
    "André Matheus\\w*": "[naam]"
    "Inga Goe[td]h?als": "[naam]"
    "Marina [Vv]an Steenwegen": "[naam]"
  exclude:
    _gyXSz5yD14: "titled 23/03/2026 but byte-identical to cSppfmeNUN4 (23/02/2026); the speech refers to an info session 'on 26 February' ahead and to 'the councils of December and January', so it is the February session re-uploaded (checked 24 Sep 2026)"
